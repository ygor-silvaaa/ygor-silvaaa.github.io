<!DOCTYPE html>
<html lang="pt-BR">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Calculadora de Orcamento - Entrega</title>
    </head>
    <body>

        <h1>Orcamento de Entrega</h1>

        <!-- Formulario para coletar os dados -->
         <form id="budget-form">
                                   <!-- Campo para a distancia -->
             <label for="distance-imput">distancia (<em> KM):</em></label>
             <input type="number" id="distance-input" min="0" required>

             <br><br>

             <!-- Campo para as Paradas adicionais -->
              <label for="stops-input">Quantidade de Paradas:</label>
              <input type="number" id="stops-input" min="0" default="0" required>

              <br><br>
              <button type="submit" id="calculate-btn">Calcular Orcamento</button>
         </form>
              <!-- Local onde o resultado final vai aparecer na tela -->
               <h2 id="result-display">Total: R$ 0,00</h2>
               <!-- Vincula o seu arquivo de logica javascript a esta pagina -->
               <script src="script.js"></script>      
    </body>
</html>
